# Token Economy Rules
# Heuristics for detecting token waste in harness artifacts.

rules:
  repeated_boilerplate:
    description: "Identical or near-identical blocks across multiple task briefs"
    detection: "Hash or fuzzy match of paragraphs across N most recent briefs"
    threshold: "Same block appearing in 2+ briefs"
    proposed_action: "Extract to a template or generator script"

  long_copied_instructions:
    description: "Instructions that should live in durable templates, not inline"
    detection: "Paragraph longer than 5 lines that appears unchanged in 2+ briefs"
    threshold: "Line count > 5 AND repeat count >= 2"
    proposed_action: "Move to template, reference by name"

  broad_historical_reads:
    description: "Brief or review that references entire history instead of bounded window"
    detection: "Phrases like 'all tasks', 'entire history', unbounded glob patterns"
    threshold: "Any occurrence"
    proposed_action: "Replace with bounded read or index lookup"

  implementation_detail_in_brief:
    description: "Task brief includes implementation detail better discovered by tools"
    detection: "Code snippets or step-by-step implementation plans in brief"
    threshold: "More than 3 lines of code or step-by-step implementation detail"
    proposed_action: "Replace with acceptance criteria and let tools discover the implementation"

  review_copies_policy:
    description: "Review sections that repeat policy text instead of citing it"
    detection: "Policy text in review that matches governance doc verbatim"
    threshold: "Verbatim match of 3+ lines"
    proposed_action: "Cite policy reference, do not copy full text"

  missing_generator_use:
    description: "Artifacts that could be generated by existing scripts"
    detection: "Hand-written content matching a generator template pattern"
    threshold: "Any occurrence"
    proposed_action: "Use generator script, document why if hand-written"
