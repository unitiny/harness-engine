# Data Cockpit Agent - Acceptance Testing Environment Configuration
# Copy this file to env.yaml and fill in your actual values.
# Single source of truth for all acceptance test parameters

default_env: dev

environments:
  dev:
    base_url: "http://localhost:3000"
    api_base_url: "http://localhost:8080/api"
    auth_url: "http://localhost:8080/auth"
    timeout: 30000
    credentials:
      username: "${TEST_USERNAME}"
      password: "${TEST_PASSWORD}"
  staging:
    base_url: "https://staging-cockpit.example.com"
    api_base_url: "https://staging-api-cockpit.example.com"
    timeout: 60000
    credentials:
      username: "${STAGING_USERNAME}"
      password: "${STAGING_PASSWORD}"
  production:
    base_url: "https://cockpit.example.com"
    api_base_url: "https://api-cockpit.example.com"
    timeout: 60000
    credentials:
      username: "${PROD_USERNAME}"
      password: "${PROD_PASSWORD}"

browser:
  type: chromium
  headless: true
  slow_mo: 0
  viewport:
    width: 1280
    height: 720

retry:
  count: 2
  delay_ms: 1000

paths:
  screenshot_dir: "acceptance/reports/screenshots"
  report_dir: "acceptance/reports"
  scenario_dir: "acceptance/scenarios"
